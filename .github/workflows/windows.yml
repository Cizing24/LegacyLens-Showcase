name: Windows Web Forms verification
on:
  push:
    branches: [main, 'feature/**', 'maintenance/**', 'delivery/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore NUnit and build traditional Framework projects
        shell: pwsh
        run: |
          ./tools/restore.ps1
          ./tools/build.ps1
      - name: Provision isolated LocalDB databases
        shell: powershell
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'This reset is only for a disposable GitHub-hosted runner.' }
          $localdb=Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Filter SqlLocalDB.exe -Recurse | Sort-Object { $_.VersionInfo.FileMajorPart } -Descending | Select-Object -First 1 -ExpandProperty FullName
          $versions=@(& $localdb versions)
          $versions | Write-Output
          $engines=@($versions | ForEach-Object { if ($_ -match '\((\d+\.\d+)\.') { $Matches[1] } } | Sort-Object { [version]$_ } -Descending)
          if ($engines.Count -eq 0) { throw 'No LocalDB engine installed.' }
          $engine=if ($engines -contains '15.0') { '15.0' } else { $engines[0] }
          # Fresh runner: no project database exists yet; replace its preconfigured automatic instance.
          & $localdb stop MSSQLLocalDB
          & $localdb delete MSSQLLocalDB
          & $localdb create MSSQLLocalDB $engine -s
          if ($LASTEXITCODE -ne 0) { throw 'Explicit disposable-runner LocalDB creation failed.' }
          & $localdb info MSSQLLocalDB
          ./tools/database/setup.ps1
          ./tools/database/seed.ps1
          ./tools/database/migrate.ps1
          ./tools/database/setup.ps1 -DatabaseName LegacyLensShowcaseTests
          ./tools/database/seed.ps1 -DatabaseName LegacyLensShowcaseTests
          ./tools/database/migrate.ps1 -DatabaseName LegacyLensShowcaseTests
      - name: Run actual NUnit unit, SQL integration and migration regressions
        shell: pwsh
        run: |
          ./tests/UnitTests/bin/Release/LegacyLens.Tests.exe --result=docs/testing/ci-nunit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify public report redaction preserves outcomes
        shell: pwsh
        run: |
          python -m unittest discover -s tests/ToolTests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install browser tooling and audit lockfile
        shell: pwsh
        run: |
          npm ci --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual IIS Express browser tests
        shell: pwsh
        run: |
          ./tools/testing/start-e2e.ps1
          $ready = $false
          for ($attempt=0; $attempt -lt 30; $attempt++) {
            try { $response=Invoke-WebRequest 'http://localhost:5194/Login.aspx'; if ($response.StatusCode -eq 200) { $ready=$true;break } } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) { throw 'IIS Express failed to become ready.' }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Redact public artifact identity metadata
        id: sanitize_reports
        if: always()
        shell: pwsh
        run: |
          $reports=@('docs/testing/ci-nunit.xml','docs/testing/e2e-results.json') | Where-Object { Test-Path $_ }
          if ($reports.Count -gt 0) {
            python tools/testing/sanitize-reports.py @reports
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload executed test reports
        if: always() && steps.sanitize_reports.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-evidence
          path: |
            docs/testing/ci-nunit.xml
            docs/testing/e2e-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnose SQL startup on failure
        if: failure()
        shell: pwsh
        run: |
          $instanceLog=Join-Path $env:LOCALAPPDATA 'Microsoft\Microsoft SQL Server Local DB\Instances\MSSQLLocalDB\error.log'
          if (Test-Path $instanceLog) { Get-Content -LiteralPath $instanceLog -Tail 60 }
